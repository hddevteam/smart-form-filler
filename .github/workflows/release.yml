name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build & Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test --run

      - name: Build extension
        run: pnpm build

      - name: Create extension package
        run: |
          cd dist
          zip -r ../smart-form-filler-${{ github.ref_name }}.zip . -x "*.DS_Store*"

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          name: Smart Form Filler ${{ github.ref_name }}
          body: |
            ## Smart Form Filler ${{ github.ref_name }}
            
            ### Installation
            1. Download `smart-form-filler-${{ github.ref_name }}.zip`
            2. Extract the zip file
            3. Open Edge/Chrome extensions page (`edge://extensions` or `chrome://extensions`)
            4. Enable "Developer mode"
            5. Click "Load unpacked" and select the extracted folder
            
            ### Configuration
            - **Pure Frontend Extension** - No backend server required
            - Configure AI provider (Azure OpenAI or Ollama) directly in extension popup
            - See [README](https://github.com/${{ github.repository }}/blob/main/README.md) for detailed setup
            
            ### What's Changed
            - TypeScript-based pure frontend MV3 extension
            - Direct AI provider API calls (Azure OpenAI, Ollama)
            - Enhanced form detection and filling capabilities
            - Comprehensive test coverage (100+ tests)
          draft: false
          prerelease: false
          files: |
            smart-form-filler-${{ github.ref_name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
