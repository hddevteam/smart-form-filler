<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Form Filler (TS)</title>
    <link rel="stylesheet" href="styles/popup.css" />
  </head>
  <body>
    <!-- TS popup mounts into existing DOM containers by id -->
    <div id="config-container"></div>
    <div id="model-selector"></div>
    <!-- Optional AI test button container (renders only if present) -->
    <div id="ai-test"></div>

    <!-- Content actions (bind if present) -->
    <div id="actions">
      <button id="detectFormsBtn" class="btn">Detect Forms</button>
      <button id="analyzeContentBtn" class="btn">Analyze Content</button>
      <button id="fillFormsBtn" class="btn">Fill Forms</button>
    </div>

    <!-- Single module entry -->
    <script type="module" src="/src/popup/index.ts"></script>
  </body>
  </html>
