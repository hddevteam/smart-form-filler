<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Form Filler</title>
    <link rel="stylesheet" href="/src/styles/popup.css" />
    <style>
      .hidden {
        display: none !important;
      }
      .popup-shell {
        font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        color: #0f172a;
        background: #f8fafc;
        min-width: 640px;
        max-width: 680px;
        min-height: 520px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 16px;
        padding: 16px 20px 24px;
      }
      .popup-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }
      .popup-header__brand {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .popup-header__title {
        font-size: 18px;
        font-weight: 700;
        margin: 0;
      }
      .popup-header__subtitle {
        font-size: 13px;
        color: #475569;
        margin: 0;
      }
      .popup-header__controls {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }
      .button-row,
      .content-actions,
      .model-actions {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        align-items: center;
      }
      .content-section {
        background: #fff;
        border-radius: 16px;
        padding: 18px;
        box-shadow: 0 18px 45px rgba(15, 23, 42, 0.08);
      }
      .section-title {
        font-size: 16px;
        font-weight: 600;
        margin: 0 0 12px;
      }
      .history-layout {
        display: grid;
        grid-template-columns: 240px 1fr;
        gap: 16px;
      }
      .history-container {
        display: flex;
        flex-direction: column;
        gap: 12px;
        max-height: 320px;
        overflow-y: auto;
        padding-right: 4px;
      }
      .history-item {
        background: #fff;
        border-radius: 12px;
        padding: 12px;
        border: 1px solid #e2e8f0;
        cursor: pointer;
        transition: border 0.2s ease, box-shadow 0.2s ease;
      }
      .history-item__header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 6px;
      }
      .history-item__title {
        font-size: 14px;
        font-weight: 600;
        margin: 0;
        color: #1e293b;
      }
      .history-item__timestamp {
        font-size: 12px;
        color: #64748b;
      }
      .history-item__url {
        font-size: 12px;
        color: #2563eb;
        text-decoration: none;
        word-break: break-all;
      }
      .history-item__actions {
        display: flex;
        gap: 8px;
        margin-top: 8px;
      }
      .history-item__action-btn {
        background: #e2e8f0;
        border: none;
        border-radius: 8px;
        padding: 6px 10px;
        cursor: pointer;
        transition: background 0.2s ease;
      }
      .results-detail {
        background: #fff;
        border-radius: 16px;
        border: 1px solid #e2e8f0;
        padding: 0;
        display: flex;
        flex-direction: column;
        min-height: 320px;
      }
      .results-tabs {
        display: flex;
        border-bottom: 1px solid #e2e8f0;
      }
      .results-tab {
        flex: 1;
        padding: 12px;
        background: transparent;
        border: none;
        cursor: pointer;
        font-weight: 600;
      }
      .results-tab--active {
        border-bottom: 2px solid #2563eb;
        color: #2563eb;
      }
      .results-content {
        flex: 1;
        overflow: auto;
        padding: 16px;
      }
      .results-text,
      .results-code {
        white-space: pre-wrap;
        font-size: 13px;
        line-height: 1.6;
      }
      .results-actions {
        border-top: 1px solid #e2e8f0;
        padding: 12px 16px;
        display: flex;
        gap: 12px;
      }
      .btn {
        border: none;
        border-radius: 10px;
        padding: 10px 16px;
        font-weight: 600;
        cursor: pointer;
        background: #2563eb;
        color: #fff;
        transition: background 0.2s ease;
      }
      .btn--secondary {
        background: #0f172a;
      }
      .btn--tertiary {
        background: #e2e8f0;
        color: #0f172a;
      }
      .btn:disabled {
        background: #cbd5f5;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <div class="popup-shell">
      <header class="popup-header">
        <div class="popup-header__brand">
          <h1 class="popup-header__title">Smart Form Filler</h1>
          <p class="popup-header__subtitle">Extract, manage and reuse page data instantly</p>
        </div>
        <div class="popup-header__controls">
          <div id="model-selector" class="model-selector"></div>
          <div id="actions" class="model-actions"></div>
          <div class="popup-header__status">
            <span id="authText">Ready</span>
          </div>
        </div>
      </header>

      <section class="content-section">
        <h2 class="section-title">Actions</h2>
        <div class="button-row">
          <button id="extractDataBtn" class="btn">Extract Data Sources</button>
          <button id="clearAllBtn" class="btn btn--tertiary">Clear History</button>
        </div>
      </section>

      <section class="content-section">
        <h2 class="section-title">Content Tools</h2>
        <div class="content-actions">
          <button id="detectFormsBtn" class="btn btn--secondary">Detect Forms</button>
          <button id="analyzeContentBtn" class="btn">Analyze Page</button>
          <button id="fillFormsBtn" class="btn btn--secondary">Fill Forms</button>
        </div>
      </section>

      <section id="resultsSection" class="content-section hidden">
        <div class="history-layout">
          <aside id="historyContainer" class="history-container"></aside>
          <article id="currentResultsDetail" class="results-detail hidden">
            <div class="results-tabs">
              <button class="results-tab results-tab--active" data-tab="markdown" id="markdownTab">
                Markdown
              </button>
              <button class="results-tab" data-tab="html" id="htmlTab">Raw HTML</button>
              <button class="results-tab" data-tab="cleaned-html" id="cleanedHtmlTab">
                Cleaned HTML
              </button>
              <button class="results-tab" data-tab="metadata" id="metadataTab">Metadata</button>
            </div>
            <div class="results-content">
              <div class="results-panel results-panel--active" id="markdownPanel">
                <div class="results-text" id="markdownText"></div>
              </div>
              <div class="results-panel" id="htmlPanel">
                <div class="results-text" id="htmlText"></div>
              </div>
              <div class="results-panel" id="cleanedHtmlPanel">
                <div class="results-text" id="cleanedHtmlText"></div>
              </div>
              <div class="results-panel" id="metadataPanel">
                <pre class="results-code" id="metadataData"></pre>
              </div>
            </div>
            <div class="results-actions">
              <button id="copyBtn" class="btn btn--secondary">Copy Results</button>
              <button id="chatBtn" class="btn">Open in Chat</button>
              <button id="backToHistoryBtn" class="btn btn--tertiary">Back to History</button>
            </div>
          </article>
        </div>
        <div id="connectionStatus" class="hidden"></div>
      </section>

      <section class="content-section">
        <h2 class="section-title">AI Diagnostics</h2>
        <div id="ai-test"></div>
      </section>
    </div>

    <button id="formFillerTabTrigger" type="button" class="hidden"></button>
    <div id="modal-root"></div>
    <script type="module" src="/src/popup/index.ts"></script>
  </body>
</html>
